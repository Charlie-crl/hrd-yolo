nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

freqrrr:
  enabled: true
  tiny_thr: 32.0

  rrr:
    enabled: true
    use_existing_rrr: true

  fprb:
    enabled: false
    strides: [8]

  fqa:
    enabled: false

  tgf:
    enabled: false
    strides: [8]
    gate_loss_weight: 0.05

  rr_gate:
    enabled: true
    target_mode: tiny_mask
    loss_weight: 0.05
    use_freq_aux: true
    freq_aux_target_mode: task_aligned
    freq_aux_loss_weight: 0.03
    freq_aux_start_epoch: 50
    freq_aux_warmup_epochs: 30
    detach_freq_aux: true
    target_value_mode: score
    tiny_only: true
    use_learned_spatial_gate: true
    use_detail_gain: true

  tgf_detail:
    enabled: false
    loss_weight: 0.10
    use_scalar_gain: true

  freq_gate:
    enabled: false
    loss_weight: 0.10
    use_energy: true
    use_contrast: true
    use_learned_spatial_gate: true
    use_detail_gain: true

  log:
    short_names: true
    debug_metrics: false

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, SPPF, [512, 5]]
  - [-1, 2, C2PSA, [512]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [[2, 11], 1, RRFusion, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [[12, 15], 1, Detect, [nc]]