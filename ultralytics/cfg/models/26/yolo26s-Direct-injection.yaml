# PR step 3 standalone S configuration; source: cfg/yolo26s_rrr.yaml
# Ultralytics YOLO26s + existing RRR baseline

nc: 80
end2end: True
reg_max: 1
scale: s
scales:
  s: [0.50, 0.50, 1024]

freqrrr:
  enabled: true
  tiny_thr: 32.0

  rrr:
    enabled: true
    use_existing_rrr: true

  fprb:
    enabled: false
    strides: [8]

  tgf:
    enabled: false
    strides: [8]
    gate_loss_weight: 0.05

  fqa:
    enabled: false
    lambda_f: 0.15
    warmup_epochs: 10
    apply_to_tiny_only: true
    detach_gate: true

  rr_gate:
    enabled: false
    use_freq_aux: false
    freq_aux_input_mode: full

  tgf_detail:
    enabled: false

  freq_gate:
    enabled: false

  log:
    short_names: true
    debug_metrics: false

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, SPPF, [512, 5, 3, True]]
  - [-1, 2, C2PSA, [512]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]
  - [[2, 11], 1, RRFusionDirect, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [[12, 15], 1, Detect, [nc]]
